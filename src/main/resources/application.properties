spring.application.name=eventhub
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventhub}
spring.datasource.username=${DB_USERNAME:eventhub_user}
spring.datasource.password=${DB_PASSWORD:eventhub_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false

logging.level.com.epam.eventhub=INFO
logging.file.name=logs/eventhub.log
