<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow main-content">
    <section class="form-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in</h1>
        <div class="alert error" th:if="${loginError}" th:text="${loginError}"></div>
        <form th:action="@{/login}" method="post" th:object="${loginForm}">
            <label>Email
                <input type="email" th:field="*{email}" autocomplete="email">
                <span class="field-error" th:errors="*{email}"></span>
            </label>
            <label>Password
                <input type="password" th:field="*{password}" autocomplete="current-password">
                <span class="field-error" th:errors="*{password}"></span>
            </label>
            <button class="button full" type="submit">Sign in</button>
        </form>
        <p class="muted">No account? <a th:href="@{/register}">Create one</a>.</p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
