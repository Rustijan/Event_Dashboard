<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow main-content">
    <section class="form-card">
        <p class="eyebrow">Join EventHub</p>
        <h1>Create account</h1>
        <div class="alert error" th:if="${registrationError}" th:text="${registrationError}"></div>
        <form th:action="@{/register}" method="post" th:object="${registrationForm}">
            <label>Full name
                <input type="text" th:field="*{fullName}" autocomplete="name">
                <span class="field-error" th:errors="*{fullName}"></span>
            </label>
            <label>Email
                <input type="email" th:field="*{email}" autocomplete="email">
                <span class="field-error" th:errors="*{email}"></span>
            </label>
            <label>Password
                <input type="password" th:field="*{password}" autocomplete="new-password">
                <span class="field-error" th:errors="*{password}"></span>
            </label>
            <label>Account type
                <select th:field="*{role}">
                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                </select>
            </label>
            <button class="button full" type="submit">Create account</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
